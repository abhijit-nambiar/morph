name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e '.[dev]'
      - run: pytest -q
