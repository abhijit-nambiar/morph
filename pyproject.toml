[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph"
version = "0.1.0"
description = "Consistent, region-aware, non-structural album editing from a text look."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
  "safetensors>=0.4",
  "rawpy>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
api = ["requests>=2.31"]

[project.scripts]
morph = "morph.cli:main"

[tool.setuptools.package-data]
morph = ["*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
